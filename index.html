<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resume for Charles Oliphant.">
  <title>Charles Oliphant | Resume</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f5f7;
      --surface: #ffffff;
      --text: #16181d;
      --muted: #676d78;
      --line: #dfe2e7;
      --accent: #2457d6;
      --accent-hover: #1946b8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .site-header {
      width: min(1120px, calc(100% - 40px));
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin: 0 auto;
      border-bottom: 1px solid var(--line);
    }

    .name { margin: 0; font-size: 1rem; font-weight: 720; letter-spacing: -0.015em; }
    .page-label { margin: 0; color: var(--muted); font-size: 0.9rem; }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    .resume-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1; letter-spacing: -0.055em; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 680;
      text-decoration: none;
      transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
    }

    .button.primary { border-color: var(--accent); background: var(--accent); color: #ffffff; }
    .button:hover, .button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
    .button.primary:hover, .button.primary:focus-visible { background: var(--accent-hover); color: #ffffff; }

    .resume-frame,
    .empty-state {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 12px 32px rgba(22, 24, 29, 0.06);
    }

    .resume-frame { min-height: 75vh; }
    .resume-frame iframe { width: 100%; height: 75vh; display: block; border: 0; }

    .empty-state {
      min-height: min(68vh, 620px);
      display: grid;
      place-items: center;
      padding: 40px;
      text-align: center;
    }

    .empty-content { max-width: 420px; }

    .document-mark {
      width: 74px;
      height: 92px;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafbfc;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 760;
      letter-spacing: 0.1em;
    }

    .empty-state h2 { margin: 0; font-size: 1.5rem; letter-spacing: -0.03em; }
    .empty-state p { margin: 12px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.65; }

    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    @media (max-width: 640px) {
      .site-header, main { width: min(100% - 28px, 1120px); }
      main { padding-top: 40px; }
      .resume-heading { align-items: start; flex-direction: column; }
      .actions { width: 100%; }
      .button { flex: 1; }
      .empty-state { min-height: 60vh; padding: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <p class="name">Charles Oliphant</p>
    <p class="page-label">Resume</p>
  </header>

  <main>
    <div class="resume-heading">
      <h1>Resume</h1>
      <div class="actions" id="resume-actions" hidden>
        <a class="button" href="./resume.pdf" target="_blank" rel="noreferrer">Open PDF</a>
        <a class="button primary" href="./resume.pdf" download>Download</a>
      </div>
    </div>

    <section class="empty-state" id="resume-empty" aria-labelledby="empty-heading">
      <div class="empty-content">
        <div class="document-mark" aria-hidden="true">PDF</div>
        <h2 id="empty-heading">Resume coming soon</h2>
        <p>This page is ready. The resume will appear here once it is added.</p>
      </div>
    </section>

    <section class="resume-frame" id="resume-viewer" aria-label="Resume document" hidden>
      <iframe id="resume-document" title="Charles Oliphant resume"></iframe>
    </section>

    <noscript>
      <p>JavaScript is required to display the resume on this page.</p>
    </noscript>
  </main>

  <!-- Add the finished file at /resume.pdf. The viewer and buttons will appear automatically. -->
  <script>
    const resumePath = './resume.pdf';
    const emptyState = document.getElementById('resume-empty');
    const viewer = document.getElementById('resume-viewer');
    const documentFrame = document.getElementById('resume-document');
    const actions = document.getElementById('resume-actions');

    fetch(resumePath, { method: 'HEAD', cache: 'no-store' })
      .then((response) => {
        if (!response.ok) return;
        emptyState.hidden = true;
        viewer.hidden = false;
        actions.hidden = false;
        documentFrame.src = resumePath;
      })
      .catch(() => {});
  </script>
</body>
</html>
